[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-mcp"
version = "0.1.0"
description = "Local RAG MCP server (SQLite + OpenAI-compatible embeddings) for Cline"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "openai>=1.40",
    "numpy>=1.24",
    "httpx>=0.25",
    "pypdf>=4.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0"]
dev = ["pytest>=8", "fpdf2>=2.7", "python-docx>=1.0"]

[project.scripts]
rag = "rag_mcp.cli:main"
rag-mcp = "rag_mcp.server:main"

[tool.setuptools.packages.find]
include = ["rag_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
